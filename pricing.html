<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loya — Starter €9.99 · Pro €19.99</title>
<meta name="description" content="Loya pricing: Free, Starter €9.99/month, Pro €19.99/month. / Тарифы Loya.">
<meta name="theme-color" content="#07080b">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://loya-loyalty.com/#pricing">
<meta property="og:title" content="Loya — Starter €9.99 · Pro €19.99">
<meta property="og:image" content="https://loya-loyalty.com/og-image.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body class="page" data-page="pricing">
<header class="nav scrolled">
  <div class="container nav-inner">
    <a href="/" class="brand"><img src="/logo-80.webp" alt="Loya" width="40" height="40"><span>Loya</span></a>
    <div class="nav-right">
      <select class="lang-select" aria-label="Language"><option value="ru">RU</option><option value="uk">UK</option><option value="sk">SK</option><option value="en">EN</option></select>
    </div>
  </div>
</header>
<main>
  <div class="pricing-page">
      <h1 class="h2" data-i18n="priceTitle" style="text-align:center"></h1>
      <div class="plans-trial reveal"><b data-i18n="plansTrial"></b><span data-i18n="plansTrialSub"></span></div>
      <div class="plans">
        <div class="plan pcard reveal">
          <div class="plan-name" data-i18n="planFreeName"></div>
          <div class="plan-price"><b>€0</b><span data-i18n="perMonth"></span></div>
          <ul class="plan-list"><li data-i18n="planFreeF1"></li><li data-i18n="planFreeF2"></li><li data-i18n="planFreeF3"></li></ul>
          <a class="btn btn-ghost" data-download href="/download" data-i18n="planFreeCta"></a>
        </div>
        <div class="plan pcard featured reveal">
          <div class="plan-badge" data-i18n="planStarterBadge"></div>
          <div class="plan-name">Starter</div>
          <div class="plan-price"><b>€9.99</b><span data-i18n="perMonth"></span></div>
          <ul class="plan-list"><li data-i18n="planStarterF1"></li><li data-i18n="planStarterF2"></li><li data-i18n="planStarterF3"></li><li data-i18n="planStarterF4"></li><li data-i18n="planStarterF5"></li></ul>
          <button type="button" class="btn btn-primary pick-tier" data-tier="starter" data-i18n="planStarterCta"></button>
        </div>
        <div class="plan pcard reveal">
          <div class="plan-badge plan-badge-pro" data-i18n="planProBadge"></div>
          <div class="plan-name">Pro</div>
          <div class="plan-price"><b>€19.99</b><span data-i18n="perMonth"></span></div>
          <ul class="plan-list"><li data-i18n="planProF0"></li><li data-i18n="planProF1"></li><li data-i18n="planProF2"></li><li data-i18n="planProF3"></li><li data-i18n="planProF4"></li></ul>
          <button type="button" class="btn btn-ghost pick-tier" data-tier="pro" data-i18n="planProCta"></button>
        </div>
      </div>
      <form class="checkout plans-checkout reveal" novalidate>
        <div class="tier-switch"><label><input type="radio" name="tier" value="starter" checked><span>Starter · €9.99</span></label><label><input type="radio" name="tier" value="pro"><span>Pro · €19.99</span></label></div>
        <input type="email" autocomplete="email" data-i18n-ph="emailPh" placeholder="Email" required>
        <button type="submit" class="btn btn-primary">💳 <span data-i18n="priceCta"></span></button>
        <div class="checkout-err"></div>
        <p class="plan-note" data-i18n="payNote"></p>
        <div class="plan-secure">🔒 <span data-i18n="priceSecure"></span></div>
        <p class="plan-note"><a href="/terms.html" class="muted" data-i18n="footTerms"></a></p>
      </form>
    <div class="panel" style="max-width:640px;margin:26px auto 0">
    <div class="lostkey" style="margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12)">
      <div style="font-weight:800" data-i18n="lostKey"></div>
      <p class="muted" style="font-size:13px;margin:4px 0 10px" data-i18n="lostKeyHint"></p>
      <form id="lostkey-form" novalidate style="display:flex;gap:8px;flex-wrap:wrap"><input type="email" autocomplete="email" data-i18n-ph="emailPh" placeholder="Email" style="flex:1 1 200px;min-width:0"><button type="submit" class="btn btn-ghost btn-sm" data-i18n="lostKeyBtn"></button></form>
      <div id="lostkey-msg" class="muted" style="font-size:13px;margin-top:8px"></div>
    </div>
    <p style="margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><a href="/" class="muted" data-i18n="sBack"></a><a href="/manage" class="muted" data-i18n="manageLink"></a><a href="/privacy.html" class="muted" data-i18n="footPrivacy"></a></p>
  </div>
  </div>
</main>
<script src="/i18n.js"></script>
<script src="/site.js"></script>
</body>
</html>
