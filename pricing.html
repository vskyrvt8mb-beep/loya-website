<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loya — €9.99 / месяц, 3 дня бесплатно</title>
<meta name="theme-color" content="#07080b">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Loya — €9.99 / месяц, 3 дня бесплатно">
<meta property="og:image" content="https://loya-loyalty.com/og-image.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="page" data-page="pricing">
<header class="nav scrolled">
  <div class="container nav-inner">
    <a href="/" class="brand"><img src="/logo.png" alt="Loya" width="40" height="40"><span>Loya</span></a>
    <div class="nav-right">
      <select class="lang-select" aria-label="Language"><option value="ru">RU</option><option value="uk">UK</option><option value="sk">SK</option><option value="en">EN</option></select>
    </div>
  </div>
</header>
<main>
  <div class="panel plan" style="max-width:520px">
    <div class="plan-badge" data-i18n="trialBadge"></div>
    <div class="plan-name" data-i18n="pTitle"></div>
    <div class="plan-price"><b>€9.99</b><span data-i18n="perMonth"></span></div>
    <div class="plan-compare" data-i18n="priceCompare"></div>
    <form class="checkout" novalidate>
      <input type="email" autocomplete="email" data-i18n-ph="emailPh" placeholder="Ваш email" required autofocus>
      <button type="submit" class="btn btn-primary">🎁 <span data-i18n="priceCta"></span></button>
      <div class="checkout-err"></div>
    </form>
    <p class="plan-note" data-i18n="priceNote"></p>
    <div class="plan-secure">🔒 <span data-i18n="priceSecure"></span></div>
    <ul class="plan-list" style="margin-top:26px;gap:10px"><li data-i18n="pf1"></li><li data-i18n="pf2"></li><li data-i18n="pf3"></li><li data-i18n="pf4"></li><li data-i18n="pf5"></li><li data-i18n="pf6"></li></ul>
    <div class="lostkey" style="margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12)">
      <div style="font-weight:800" data-i18n="lostKey"></div>
      <p class="muted" style="font-size:13px;margin:4px 0 10px" data-i18n="lostKeyHint"></p>
      <form id="lostkey-form" novalidate style="display:flex;gap:8px;flex-wrap:wrap"><input type="email" autocomplete="email" data-i18n-ph="emailPh" placeholder="Email" style="flex:1 1 200px;min-width:0"><button type="submit" class="btn btn-ghost btn-sm" data-i18n="lostKeyBtn"></button></form>
      <div id="lostkey-msg" class="muted" style="font-size:13px;margin-top:8px"></div>
    </div>
    <p style="margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><a href="/" class="muted" data-i18n="sBack"></a><a href="/manage" class="muted" data-i18n="manageLink"></a><a href="/privacy.html" class="muted" data-i18n="footPrivacy"></a></p>
  </div>
</main>
<script src="/i18n.js"></script>
<script src="/site.js"></script>
</body>
</html>
