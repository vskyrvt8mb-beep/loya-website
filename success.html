<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loya — добро пожаловать!</title>
<meta name="theme-color" content="#07080b">
<meta name="robots" content="noindex">
<meta property="og:title" content="Loya — добро пожаловать!">
<meta property="og:image" content="https://loya-website-one.vercel.app/og-image.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="page" data-page="success">
<header class="nav scrolled">
  <div class="container nav-inner">
    <a href="/" class="brand"><img src="/logo.png" alt="Loya" width="40" height="40"><span>Loya</span></a>
    <div class="nav-right">
      <select class="lang-select" aria-label="Language"><option value="ru">RU</option><option value="uk">UK</option><option value="sk">SK</option><option value="en">EN</option></select>
    </div>
  </div>
</header>
<main>
  <div class="panel">
    <h1 data-i18n="sTitle"></h1>
    <p id="s-loading" class="muted"><span class="spinner"></span><span data-i18n="sLoading"></span></p>
    <div id="s-ok" style="display:none">
      <div class="s-steps">
        <div class="s-step"><div class="s-num">1</div><div><h3 data-i18n="sStep1"></h3><p data-i18n="sStep1D"></p>
          <a href="#" data-download class="btn btn-primary btn-sm" style="margin-top:12px">⬇ <span data-i18n="sDownload"></span></a></div></div>
        <div class="s-step"><div class="s-num">2</div><div style="flex:1;min-width:0"><h3 data-i18n="sStep2"></h3><p data-i18n="sStep2D"></p>
          <div class="key-box"><code id="license-key"></code><button class="btn btn-ghost btn-sm" id="btn-copy" type="button"><span data-i18n="sCopy"></span></button></div>
          <p class="muted" style="font-size:13px;margin-top:8px" data-i18n="sKeySent"></p></div></div>
        <div class="s-step"><div class="s-num">3</div><div><h3 data-i18n="sStep3"></h3><p data-i18n="sStep3D"></p></div></div>
      </div>
    </div>
    <div id="s-error" style="display:none">
      <p class="muted" style="margin-top:14px" data-i18n="sError"></p>
      <a href="mailto:vladnaruto12@gmail.com" class="btn btn-primary btn-sm" style="margin-top:16px">✉️ <span data-i18n="footContact"></span></a>
    </div>
    <p style="margin-top:26px"><a href="/" class="muted" data-i18n="sBack"></a></p>
  </div>
</main>
<script src="/i18n.js"></script>
<script src="/site.js"></script>
<script>
// Ключ создаётся вебхуком Stripe через пару секунд после оплаты — поэтому пробуем
// несколько раз с паузой, прежде чем показать сообщение об ошибке.
(async function () {
  const sid = new URLSearchParams(location.search).get('session_id');
  const show = (id) => { ['s-loading', 's-ok', 's-error'].forEach(x => { document.getElementById(x).style.display = x === id ? '' : 'none'; }); };
  if (!sid) { show('s-error'); return; }
  for (let i = 0; i < 10; i++) {
    try {
      const r = await fetch('/api/get-license-by-session?session_id=' + encodeURIComponent(sid));
      const d = await r.json();
      if (d.licenseKey) {
        document.getElementById('license-key').textContent = d.licenseKey;
        show('s-ok');
        document.getElementById('btn-copy').addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(d.licenseKey); } catch (e) {
            const rng = document.createRange(); rng.selectNodeContents(document.getElementById('license-key'));
            const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rng); document.execCommand('copy');
          }
          const lbl = document.querySelector('#btn-copy span'); lbl.textContent = window.loyaT('sCopied');
          setTimeout(() => { lbl.textContent = window.loyaT('sCopy'); }, 2000);
        });
        return;
      }
    } catch (e) { /* пробуем ещё раз */ }
    await new Promise(r => setTimeout(r, 2000));
  }
  show('s-error');
})();
</script>
</body>
</html>
