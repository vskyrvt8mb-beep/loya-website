<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
  html, body { margin: 0; background: transparent; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; user-select: none; overflow: hidden; }
  .box { margin: 8px; border-radius: 16px; padding: 8px; color: #f3ead5;
    background: linear-gradient(160deg, rgba(34,30,24,.98), rgba(12,11,9,.98));
    border: 1px solid rgba(var(--acc-rgb), .45); box-shadow: 0 18px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 6px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #1b1205;
    background: linear-gradient(135deg, var(--acc), var(--acc2)); overflow: hidden; flex: 0 0 30px; }
  .mark img { width: 100%; height: 100%; object-fit: contain; background: #111; }
  .head b { font-size: 14px; display: block; }
  .head span { font-size: 11.5px; opacity: .6; }
  button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: none; border-radius: 10px; background: none;
    color: inherit; font: inherit; font-size: 13.5px; font-weight: 600; text-align: left; cursor: pointer; }
  button:hover { background: rgba(var(--acc-rgb), .16); }
  button i { font-style: normal; width: 20px; text-align: center; }
  .sep { height: 1px; background: rgba(255,255,255,.08); margin: 6px 4px; }
  .quit { color: #ff8a80; }
  .quit:hover { background: rgba(255,90,80,.14); }
  .hint p { margin: 4px 10px 10px; font-size: 13px; line-height: 1.45; opacity: .85; }
  .hint .ok { justify-content: center; margin-top: 4px; background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #1b1205; font-weight: 800; }
  .hint .ok:hover { filter: brightness(1.06); background: linear-gradient(135deg, var(--acc), var(--acc2)); }
</style></head>
<body><div class="box" id="box"></div>
<script src="tray.js"></script>
</body></html>
